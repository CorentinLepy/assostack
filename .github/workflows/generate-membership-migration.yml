name: Generate membership migration

on:
  push:
    branches:
      - crm/memberships

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://assostack:assostack-migration-gen@127.0.0.1:5432/assostack
      PAYLOAD_SECRET: migration-generation-only-not-a-production-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3001
      PUBLIC_WEB_URL: http://localhost:4321
      NODE_ENV: production
      PAYLOAD_DB_PUSH: "false"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: assostack
          POSTGRES_USER: assostack
          POSTGRES_PASSWORD: assostack-migration-gen
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U assostack -d assostack"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply current migrations
        run: pnpm db:migrate

      - name: Generate membership migration
        run: pnpm db:migrate:create -- crm_memberships

      - name: Commit generated migration when needed
        run: |
          if git diff --quiet -- apps/admin/src/migrations; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/migrations
          git commit -m "db: add membership lifecycle migration"
          git push origin HEAD:crm/memberships
