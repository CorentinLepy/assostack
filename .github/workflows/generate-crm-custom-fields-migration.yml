name: Generate CRM custom fields migration artifact

on:
  push:
    branches:
      - crm/custom-fields

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://assostack:assostack-ci@127.0.0.1:5432/assostack
      PAYLOAD_SECRET: generation-only-value
      NEXT_PUBLIC_SERVER_URL: http://localhost:3001
      PUBLIC_WEB_URL: http://localhost:4321
      NODE_ENV: production
      PAYLOAD_DB_PUSH: "false"
      ASSOSTACK_JOBS_AUTORUN: "false"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: assostack
          POSTGRES_USER: assostack
          POSTGRES_PASSWORD: assostack-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U assostack -d assostack"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply existing migrations
        run: pnpm db:migrate
      - name: Generate migration
        run: pnpm --filter @assostack/admin migrate:create crm_custom_fields --force-accept-warning
      - name: Upload generated migration
        uses: actions/upload-artifact@v4
        with:
          name: crm-custom-fields-migration
          path: apps/admin/src/migrations/
          retention-days: 1
