name: Fix privacy bootstrap fixture

on:
  push:
    branches:
      - crm/privacy-consent

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Keep tenant admin non-platform in privacy tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/admin/tests/int/privacy.int.spec.ts')
          text = path.read_text()

          marker = """    adminB = await payload.create({\n"""
          demotion = """    adminA = await payload.update({\n      collection: 'users',\n      id: adminA.id,\n      overrideAccess: true,\n      data: {\n        platformRoles: ['user'],\n      },\n    })\n\n    adminB = await payload.create({\n"""
          if "adminA = await payload.update({" not in text:
              if marker not in text:
                  raise SystemExit('adminB marker not found')
              text = text.replace(marker, demotion, 1)

          start = """    const debugUserA = await persistedRequestUser(payload, adminA)\n"""
          end = """    console.log('PRIVACY_DEBUG_ACCESS', JSON.stringify(debugAccessResult))\n\n"""
          if start in text:
              before, rest = text.split(start, 1)
              if end not in rest:
                  raise SystemExit('diagnostic end marker not found')
              _, after = rest.split(end, 1)
              text = before + after

          assertion_marker = """    expect(purposeA.legalBasis).toBe('consent')\n"""
          assertion = assertion_marker + """\n    const persistedAdminA = await persistedRequestUser(payload, adminA)\n    expect((persistedAdminA as any).platformRoles).toEqual(['user'])\n"""
          if "persistedAdminA as any).platformRoles" not in text:
              if assertion_marker not in text:
                  raise SystemExit('assertion marker not found')
              text = text.replace(assertion_marker, assertion, 1)

          path.write_text(text)
          PY

      - name: Commit fixture correction when needed
        run: |
          if git diff --quiet -- apps/admin/tests/int/privacy.int.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/tests/int/privacy.int.spec.ts
          git commit -m "test(crm): keep privacy tenant admin non-platform"
          git push origin HEAD:crm/privacy-consent
