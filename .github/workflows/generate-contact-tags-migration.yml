name: Generate CRM contact tags migration

on:
  push:
    branches:
      - crm/contact-tags

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://assostack@127.0.0.1:5432/assostack
      PAYLOAD_SECRET: generation-only-value
      NEXT_PUBLIC_SERVER_URL: http://localhost:3001
      PUBLIC_WEB_URL: http://localhost:4321
      NODE_ENV: production
      PAYLOAD_DB_PUSH: "false"
      ASSOSTACK_JOBS_AUTORUN: "false"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: assostack
          POSTGRES_USER: assostack
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U assostack -d assostack"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check whether migration already exists
        id: existing
        run: |
          if find apps/admin/src/migrations -maxdepth 1 -type f -name '*crm_contact_tags*.json' | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        if: steps.existing.outputs.exists != 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install dependencies
        if: steps.existing.outputs.exists != 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply existing migrations
        if: steps.existing.outputs.exists != 'true'
        run: pnpm db:migrate

      - name: Generate migration
        if: steps.existing.outputs.exists != 'true'
        run: pnpm --filter @assostack/admin migrate:create crm_contact_tags --force-accept-warning

      - name: Commit generated migration
        if: steps.existing.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/migrations/
          git commit -m "db(crm): add contact tags migration"
          git push origin HEAD:crm/contact-tags
