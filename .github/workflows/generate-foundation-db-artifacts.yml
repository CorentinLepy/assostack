name: Generate foundation DB artifacts

on:
  push:
    branches:
      - foundation/database-migrations

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message != 'db: generate initial schema migration and lockfile'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://assostack:assostack-ci@127.0.0.1:5432/assostack
      PAYLOAD_SECRET: generation-only-not-a-production-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3001
      PUBLIC_WEB_URL: http://localhost:4321
      NODE_ENV: production
      PAYLOAD_DB_PUSH: "false"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: assostack
          POSTGRES_USER: assostack
          POSTGRES_PASSWORD: assostack-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U assostack -d assostack"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: foundation/database-migrations

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install and create lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Generate initial Payload migration
        run: pnpm --filter @assostack/admin migrate:create initial_schema --force-accept-warning

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/admin/src/migrations/
          git commit -m "db: generate initial schema migration and lockfile"
          git push origin HEAD:foundation/database-migrations
