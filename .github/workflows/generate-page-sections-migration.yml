name: Generate page sections migration

on:
  push:
    branches:
      - cms/page-sections

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://assostack:assostack-ci@127.0.0.1:5432/assostack
      PAYLOAD_SECRET: generation-only-not-a-production-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3001
      PUBLIC_WEB_URL: http://localhost:4321
      NODE_ENV: production
      PAYLOAD_DB_PUSH: "false"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: assostack
          POSTGRES_USER: assostack
          POSTGRES_PASSWORD: assostack-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U assostack -d assostack"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply existing migrations
        run: pnpm --filter @assostack/admin migrate

      - name: Generate migration
        run: pnpm --filter @assostack/admin migrate:create page_sections --force-accept-warning

      - name: Collect generated migration
        run: |
          mkdir -p migration-artifact
          find apps/admin/src/migrations -maxdepth 1 -type f \( -name '*page_sections*.ts' -o -name '*page_sections*.json' -o -name 'index.ts' \) -exec cp {} migration-artifact/ \;
          ls -la migration-artifact

      - name: Upload generated migration
        uses: actions/upload-artifact@v7
        with:
          name: page-sections-migration
          path: migration-artifact/
          if-no-files-found: error
