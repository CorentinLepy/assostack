name: Fix membership test expectations

on:
  push:
    branches:
      - crm/memberships

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Align tests with Payload validation semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/admin/tests/int/memberships.int.spec.ts')
          text = path.read_text()

          text = text.replace(
              ").rejects.toThrow(/Membership Type/i)",
              ").rejects.toThrow(/membershipType/i)",
          )
          text = text.replace(
              ").rejects.toThrow(/end date/i)",
              ").rejects.toThrow(/endsAt/i)",
          )
          text = text.replace(
              ").rejects.toThrow(/membership number/i)",
              ").rejects.toThrow(/membershipNumber/i)",
          )

          old = """  test('does not expose membership taxonomy or lifecycle to ordinary members', async () => {\n    const types = await payload.find({\n      collection: 'membership-types',\n      overrideAccess: false,\n      user: (await persistedRequestUser(payload, memberA)) as any,\n      limit: 50,\n    })\n    const memberships = await payload.find({\n      collection: 'memberships',\n      overrideAccess: false,\n      user: (await persistedRequestUser(payload, memberA)) as any,\n      limit: 50,\n    })\n\n    expect(types.docs).toHaveLength(0)\n    expect(memberships.docs).toHaveLength(0)\n\n    await expect(\n"""
          new = """  test('does not expose membership taxonomy or lifecycle to ordinary members', async () => {\n    await expect(\n      payload.find({\n        collection: 'membership-types',\n        overrideAccess: false,\n        user: (await persistedRequestUser(payload, memberA)) as any,\n        limit: 50,\n      }),\n    ).rejects.toThrow()\n\n    await expect(\n      payload.find({\n        collection: 'memberships',\n        overrideAccess: false,\n        user: (await persistedRequestUser(payload, memberA)) as any,\n        limit: 50,\n      }),\n    ).rejects.toThrow()\n\n    await expect(\n"""
          if old not in text:
              raise SystemExit('member denial block not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit corrections when needed
        run: |
          if git diff --quiet -- apps/admin/tests/int/memberships.int.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/tests/int/memberships.int.spec.ts
          git commit -m "test(crm): align membership assertions with Payload errors"
          git push origin HEAD:crm/memberships
