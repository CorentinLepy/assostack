name: Fix privacy auth fixture

on:
  push:
    branches:
      - crm/privacy-consent

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use persisted users for protected Local API calls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/admin/tests/int/privacy.int.spec.ts')
          text = path.read_text()

          text = text.replace("import { getOrganizationIDsForRoles } from '@/access/organizations'\n", '')

          marker = """const asRequestUser = <T extends Record<string, unknown>>(user: T) => ({\n  ...structuredClone(user),\n  collection: 'users' as const,\n})\n"""
          helper = marker + """\nconst persistedRequestUser = async (payload: Payload, user: { id: number | string }) =>\n  asRequestUser(\n    (await payload.findByID({\n      collection: 'users',\n      id: user.id,\n      depth: 0,\n      overrideAccess: true,\n    })) as Record<string, unknown>,\n  )\n"""
          if 'const persistedRequestUser =' not in text:
              if marker not in text:
                  raise SystemExit('request-user helper marker not found')
              text = text.replace(marker, helper, 1)

          for name in ('adminA', 'adminB', 'editorA', 'memberA'):
              text = text.replace(
                  f'user: asRequestUser({name}) as any,',
                  f'user: (await persistedRequestUser(payload, {name})) as any,',
              )

          diagnostic = """    expect(getOrganizationIDsForRoles(asRequestUser(adminA), ['organization-admin', 'editor'])).toEqual([\n      organizationA.id,\n    ])\n"""
          text = text.replace(diagnostic, '')

          path.write_text(text)
          PY

      - name: Commit fixture fix when needed
        run: |
          if git diff --quiet -- apps/admin/tests/int/privacy.int.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/tests/int/privacy.int.spec.ts
          git commit -m "test(crm): reload persisted users for privacy access checks"
          git push origin HEAD:crm/privacy-consent
