name: Fix privacy test fixture

on:
  push:
    branches:
      - crm/privacy-consent

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deep-clone Local API request users
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/admin/tests/int/privacy.int.spec.ts')
          text = path.read_text()
          old = """const asRequestUser = <T extends Record<string, unknown>>(user: T) => ({\n  ...user,\n  collection: 'users' as const,\n})\n"""
          new = """const asRequestUser = <T extends Record<string, unknown>>(user: T) => ({\n  ...structuredClone(user),\n  collection: 'users' as const,\n})\n"""
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fixture fix when needed
        run: |
          if git diff --quiet -- apps/admin/tests/int/privacy.int.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/tests/int/privacy.int.spec.ts
          git commit -m "test(crm): deep-clone request users in privacy fixtures"
          git push origin HEAD:crm/privacy-consent
