name: Generate forms migration

on:
  workflow_dispatch:
  push:
    branches:
      - association/forms-submissions
    paths:
      - .github/workflows/generate-forms-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: assostack
          POSTGRES_PASSWORD: assostack-ci
          POSTGRES_DB: assostack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assostack -d assostack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://assostack:assostack-ci@127.0.0.1:5432/assostack
      PAYLOAD_SECRET: generation-only-value
      NEXT_PUBLIC_SERVER_URL: http://localhost:3001
      PUBLIC_WEB_URL: http://localhost:4321
      NODE_ENV: production
      PAYLOAD_DB_PUSH: "false"
      ASSOSTACK_JOBS_AUTORUN: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: association/forms-submissions
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @assostack/admin migrate:create forms_submissions --force-accept-warning
      - name: Harden generated migration
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('apps/admin/src/migrations').glob('*_forms_submissions.ts'))
          if not files:
              raise SystemExit('forms migration not found')
          p = files[-1]
          s = p.read_text()
          needle = '  CREATE INDEX "forms_key_idx" ON "forms" USING btree ("key");'
          if 'forms_organization_key_unique' not in s:
              if needle not in s:
                  raise SystemExit('forms key index anchor not found')
              s = s.replace(needle, '  CREATE UNIQUE INDEX "forms_organization_key_unique" ON "forms" USING btree ("organization_id","key");\n' + needle)
          old = '''   ALTER TABLE "forms_fields_options" DISABLE ROW LEVEL SECURITY;\n  ALTER TABLE "forms_fields" DISABLE ROW LEVEL SECURITY;\n  ALTER TABLE "forms" DISABLE ROW LEVEL SECURITY;\n  ALTER TABLE "form_submissions_values" DISABLE ROW LEVEL SECURITY;\n  ALTER TABLE "form_submissions" DISABLE ROW LEVEL SECURITY;\n  ALTER TABLE "form_submissions_texts" DISABLE ROW LEVEL SECURITY;\n  DROP TABLE "forms_fields_options" CASCADE;\n  DROP TABLE "forms_fields" CASCADE;\n  DROP TABLE "forms" CASCADE;\n  DROP TABLE "form_submissions_values" CASCADE;\n  DROP TABLE "form_submissions" CASCADE;\n  DROP TABLE "form_submissions_texts" CASCADE;\n  ALTER TABLE "payload_locked_documents_rels" DROP CONSTRAINT "payload_locked_documents_rels_forms_fk";\n  \n  ALTER TABLE "payload_locked_documents_rels" DROP CONSTRAINT "payload_locked_documents_rels_form_submissions_fk";\n  \n  DROP INDEX "payload_locked_documents_rels_forms_id_idx";\n  DROP INDEX "payload_locked_documents_rels_form_submissions_id_idx";\n  ALTER TABLE "payload_locked_documents_rels" DROP COLUMN "forms_id";\n  ALTER TABLE "payload_locked_documents_rels" DROP COLUMN "form_submissions_id";'''
          new = '''   ALTER TABLE "payload_locked_documents_rels" DROP CONSTRAINT "payload_locked_documents_rels_forms_fk";\n  ALTER TABLE "payload_locked_documents_rels" DROP CONSTRAINT "payload_locked_documents_rels_form_submissions_fk";\n  DROP INDEX "payload_locked_documents_rels_forms_id_idx";\n  DROP INDEX "payload_locked_documents_rels_form_submissions_id_idx";\n  ALTER TABLE "payload_locked_documents_rels" DROP COLUMN "forms_id";\n  ALTER TABLE "payload_locked_documents_rels" DROP COLUMN "form_submissions_id";\n  ALTER TABLE "forms_fields_options" DISABLE ROW LEVEL SECURITY;\n  ALTER TABLE "forms_fields" DISABLE ROW LEVEL SECURITY;\n  ALTER TABLE "forms" DISABLE ROW LEVEL SECURITY;\n  ALTER TABLE "form_submissions_values" DISABLE ROW LEVEL SECURITY;\n  ALTER TABLE "form_submissions" DISABLE ROW LEVEL SECURITY;\n  ALTER TABLE "form_submissions_texts" DISABLE ROW LEVEL SECURITY;\n  DROP TABLE "forms_fields_options" CASCADE;\n  DROP TABLE "forms_fields" CASCADE;\n  DROP TABLE "forms" CASCADE;\n  DROP TABLE "form_submissions_values" CASCADE;\n  DROP TABLE "form_submissions" CASCADE;\n  DROP TABLE "form_submissions_texts" CASCADE;'''
          if old in s:
              s = s.replace(old, new)
          elif 'DROP TABLE "forms" CASCADE;\n  DROP TABLE "form_submissions_values" CASCADE;' in s and s.find('payload_locked_documents_rels_forms_fk') > s.find('DROP TABLE "forms" CASCADE;'):
              raise SystemExit('rollback hardening anchor changed')
          p.write_text(s)
          print(f'hardened {p}')
          PY
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/migrations/
          git commit -m "db(association): add forms submissions migration"
          git push origin HEAD:association/forms-submissions
