name: Generate documents migration

# Temporary migration generator; remove after versioning the generated migration.
on:
  push:
    branches:
      - association/documents
    paths:
      - .github/workflows/generate-documents-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: assostack
          POSTGRES_PASSWORD: assostack-ci
          POSTGRES_DB: assostack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assostack -d assostack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://assostack:assostack-ci@127.0.0.1:5432/assostack
      PAYLOAD_SECRET: generation-only-value
      NEXT_PUBLIC_SERVER_URL: http://localhost:3001
      PUBLIC_WEB_URL: http://localhost:4321
      NODE_ENV: production
      PAYLOAD_DB_PUSH: "false"
      ASSOSTACK_JOBS_AUTORUN: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: association/documents
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @assostack/admin migrate:create association_documents --force-accept-warning
      - name: Harden generated rollback
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('apps/admin/src/migrations').glob('*_association_documents.ts'))
          if not files:
              raise SystemExit('documents migration not found')
          p = files[-1]
          s = p.read_text()
          marker = 'payload_locked_documents_rels_documents_fk'
          drop_table = 'DROP TABLE "documents" CASCADE;'
          if marker in s and drop_table in s and s.find(marker) > s.find(drop_table):
              lines = s.splitlines()
              rel = []
              rest = []
              in_down = False
              for line in lines:
                  if 'export async function down' in line:
                      in_down = True
                  if in_down and ('payload_locked_documents_rels_documents' in line or 'DROP COLUMN "documents_id"' in line):
                      rel.append(line)
                  else:
                      rest.append(line)
              if rel:
                  idx = next((i for i,l in enumerate(rest) if drop_table in l), None)
                  if idx is None:
                      raise SystemExit('documents rollback table anchor not found')
                  rest[idx:idx] = rel
                  s = '\n'.join(rest) + '\n'
          p.write_text(s)
          print(f'hardened {p}')
          PY
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/migrations/
          git commit -m "db(association): add documents migration"
          git push origin HEAD:association/documents
